name: Collect and publish

# Runs every hour (at :17, to avoid the busy top of the hour), and on demand from the Actions tab.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "How many hours back to collect"
        default: "6"

permissions:
  contents: write # push to the data branch
  pages: write
  id-token: write
  actions: write # keepalive: re-enables the schedule so GitHub doesn't pause it after 60 quiet days

concurrency:
  group: collect
  cancel-in-progress: false

env:
  DATA_BRANCH: data
  HF_HOME: ${{ github.workspace }}/.cache/huggingface

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch (created on first run)
        run: |
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            git worktree add data "origin/$DATA_BRANCH"
            git -C data switch -c "$DATA_BRANCH"
          else
            git worktree add --detach data
            git -C data switch --orphan "$DATA_BRANCH"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (CPU-only PyTorch keeps the download small)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[model]"

      - name: Cache the sentiment model
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-${{ hashFiles('src/murmur/sentiment.py') }}

      - name: Run the pipeline
        run: murmur run --sentiment model --data data --out public --hours "${{ inputs.hours || '6' }}"

      - name: Save data to the data branch
        run: |
          cd data
          git config user.name "murmur-bot"
          git config user.email "murmur-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -q -m "Data: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push origin "HEAD:$DATA_BRANCH"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Keep the schedule alive
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true
